<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanCred — Get credit for cleaning up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9E7DD;
    --panel: #F5F4EE;
    --ink: #1B2420;
    --ink-soft: #4B564F;
    --forest: #1F5A3C;
    --forest-dark: #163F2A;
    --moss: #6B8F71;
    --signal: #E8A227;
    --signal-dark: #B87C15;
    --clay: #C4573B;
    --line: #CFCABE;
    --white: #FFFFFF;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    line-height:0.98;
    letter-spacing:0.2px;
    margin:0;
    color:var(--forest-dark);
  }
  p{margin:0 0 12px 0;}
  a{color:inherit;}
  button, input, textarea, select{font-family:inherit; font-size:1rem;}
  ::selection{background:var(--signal); color:var(--ink);}
  :focus-visible{outline:3px solid var(--signal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---- Shell ---- */
  #app{min-height:100vh; display:flex; flex-direction:column;}

  header.topbar{
    background:var(--forest);
    color:var(--white);
    border-bottom:4px solid var(--signal);
    position:sticky; top:0; z-index:40;
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .logo{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:0.5px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; background:none; border:none; color:var(--white); padding:0;
  }
  .logo .mark{
    width:12px;height:12px; background:var(--signal); display:inline-block; transform:rotate(45deg);
  }
  .navtoggle{
    background:transparent; border:2px solid rgba(255,255,255,0.5); color:var(--white);
    padding:8px 14px; border-radius:var(--radius); cursor:pointer;
    font-weight:600; display:flex; align-items:center; gap:8px;
  }
  .navtoggle:hover{border-color:var(--white);}

  nav.navpanel{
    display:none;
    background:var(--forest-dark);
    border-bottom:1px solid rgba(255,255,255,0.15);
  }
  nav.navpanel.open{display:block;}
  .navpanel-inner{
    max-width:1080px; margin:0 auto; padding:10px 20px 18px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:4px;
  }
  .navlink{
    text-align:left; background:none; border:none; color:rgba(255,255,255,0.85);
    padding:12px 10px; font-size:1.02rem; font-weight:600; cursor:pointer;
    border-left:3px solid transparent; display:flex; flex-direction:column; gap:2px;
  }
  .navlink small{font-weight:400; color:rgba(255,255,255,0.55); font-size:0.78rem;}
  .navlink:hover{background:rgba(255,255,255,0.06); border-left-color:var(--signal);}
  .navlink.active{border-left-color:var(--signal); color:var(--white); background:rgba(255,255,255,0.08);}

  main{flex:1; width:100%;}
  .wrap{max-width:1080px; margin:0 auto; padding:40px 20px 60px;}
  .wrap.narrow{max-width:680px;}

  footer.site{
    border-top:1px solid var(--line); padding:22px 20px; text-align:center;
    color:var(--ink-soft); font-size:0.84rem; background:var(--panel);
  }
  footer.site strong{color:var(--ink);}

  /* ---- Generic bits ---- */
  .eyebrow{ color:var(--moss); font-weight:600; font-size:0.92rem; margin-bottom:6px; }
  .section{margin-bottom:52px;}
  .section:last-child{margin-bottom:0;}
  .rule{border:none; border-top:1px solid var(--line); margin:36px 0;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:2px solid var(--forest); background:var(--forest); color:var(--white);
    padding:12px 22px; font-weight:700; border-radius:var(--radius); cursor:pointer;
    font-size:1rem;
  }
  .btn:hover{background:var(--forest-dark); border-color:var(--forest-dark);}
  .btn.secondary{background:transparent; color:var(--forest); }
  .btn.secondary:hover{background:rgba(31,90,60,0.08);}
  .btn.signal{background:var(--signal); border-color:var(--signal); color:var(--ink);}
  .btn.signal:hover{background:var(--signal-dark); border-color:var(--signal-dark); color:var(--white);}
  .btn.clay{background:var(--clay); border-color:var(--clay); color:var(--white);}
  .btn.clay:hover{background:#a3452e; border-color:#a3452e;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn.block{width:100%;}

  .card{
    background:var(--panel); border:1px solid var(--line); padding:22px; border-radius:var(--radius);
  }

  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:600; margin-bottom:6px; font-size:0.92rem;}
  .field input, .field textarea{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--radius);
    background:var(--white); color:var(--ink);
  }
  .field input:focus, .field textarea:focus{border-color:var(--forest);}
  .hint{font-size:0.82rem; color:var(--ink-soft); margin-top:4px;}

  .banner{padding:14px 16px; border-radius:var(--radius); font-size:0.92rem; margin-bottom:18px; border:1.5px solid;}
  .banner.ok{background:#EAF3EC; border-color:var(--forest); color:var(--forest-dark);}
  .banner.warn{background:#FBEFE3; border-color:var(--signal-dark); color:#7A4F0E;}
  .banner.err{background:#F8E9E5; border-color:var(--clay); color:#7A2E1B;}

  .steps{display:flex; flex-direction:column; gap:0;}
  .step{display:flex; gap:16px; padding:20px 0; border-top:1px solid var(--line);}
  .step:first-child{border-top:none;}
  .stepnum{
    font-family:'Barlow Condensed', sans-serif; font-weight:900; font-size:2.2rem; color:var(--moss);
    min-width:46px;
  }

  /* mission */
  .hero{padding-top:10px;}
  .hero h1{font-size:clamp(2.6rem, 7vw, 4.6rem);}
  .hero .lede{font-size:1.15rem; max-width:640px; color:var(--ink-soft); margin-top:16px;}
  .hero-actions{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}
  .statrow{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-top:32px;
  }
  .stat{
    background:var(--panel); padding:20px 14px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .stat .stat-ic{font-size:1.15rem; line-height:1; opacity:0.85;}
  .stat .num{font-family:'Barlow Condensed'; font-weight:900; font-size:2rem; color:var(--forest); line-height:1;}
  .stat .lab{font-size:0.74rem; color:var(--ink-soft); line-height:1.25; max-width:120px;}
  @media (max-width:760px){
    .statrow{grid-template-columns:repeat(2,1fr);}
    .stat:last-child{grid-column:1 / -1;}
  }
  @media (max-width:560px){
    .hero-actions{flex-direction:column; align-items:stretch;}
    .hero-actions .btn{width:100%;}
  }

  /* record page */
  .camwrap{background:#0E1512; border-radius:var(--radius); overflow:hidden; position:relative; aspect-ratio:4/3; max-width:480px;}
  .camwrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .recdot{position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px; color:#fff; font-size:0.82rem; font-weight:700; background:rgba(0,0,0,0.4); padding:4px 9px; border-radius:20px;}
  .recdot .dot{width:9px;height:9px;border-radius:50%; background:var(--clay);}

  .spotlist{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .spotitem{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem;}
  .spotitem .dist{color:var(--ink-soft); font-size:0.82rem;}

  /* dashboard */
  .credittag{
    display:inline-flex; align-items:baseline; gap:8px; background:var(--forest); color:var(--white);
    padding:16px 22px; border-radius:var(--radius);
  }
  .credittag .num{font-family:'Barlow Condensed'; font-weight:900; font-size:3rem; color:var(--signal);}
  .credittag .lab{font-size:0.9rem;}
  .histlist{margin-top:8px;}
  .histrow{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:0.92rem;}
  .histrow:first-child{border-top:none;}
  .histrow .amt.plus{color:var(--forest); font-weight:700;}
  .histrow .amt.minus{color:var(--clay); font-weight:700;}
  .histrow .when{color:var(--ink-soft); font-size:0.8rem;}

  /* business grid */
  .bizgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-top:10px;}
  .bizcard{background:var(--white); border:1px solid var(--line); padding:18px; border-radius:var(--radius); display:flex; flex-direction:column; gap:8px;}
  .bizcard .emoji{font-size:1.8rem;}
  .bizcard .name{font-weight:700; font-size:1.05rem;}
  .bizcard .cat{color:var(--moss); font-size:0.8rem; font-weight:600;}
  .bizcard .offer{font-size:0.9rem; color:var(--ink-soft); flex:1;}
  .bizcard .cost{font-weight:700; color:var(--forest-dark);}

  .amtgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
  .amtbtn{padding:14px 6px; border:2px solid var(--line); background:var(--white); border-radius:var(--radius); font-weight:700; cursor:pointer; text-align:center;}
  .amtbtn.sel{border-color:var(--signal); background:#FBF1DD;}

  .badge{display:inline-block; background:var(--signal); color:var(--ink); font-weight:700; font-size:0.72rem; padding:3px 8px; border-radius:20px;}

  /* learn: game hub */
  .gamegrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-top:10px;}
  .gamecard{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:8px;}
  .gamecard .gicon{font-size:2rem;}
  .gamecard .gtitle{font-weight:700; font-size:1.08rem; color:var(--forest-dark);}
  .gamecard .gblurb{font-size:0.88rem; color:var(--ink-soft); flex:1;}
  .gamecard .greward{font-weight:700; font-size:0.8rem; color:var(--forest);}
  .gamecard.soon{opacity:0.62;}
  .gamecard.soon .greward{color:var(--ink-soft);}

  /* learn: sort-it-right game */
  .itemcard{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:34px 20px; text-align:center; max-width:340px; margin-top:14px;}
  .itemcard .em{font-size:3.2rem; line-height:1;}
  .itemcard .nm{font-weight:700; font-size:1.15rem; margin-top:10px; color:var(--forest-dark);}
  .binrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:520px; margin-top:16px;}
  .binbtn{border:2px solid var(--line); background:var(--white); border-radius:var(--radius); padding:16px 6px; cursor:pointer; text-align:center; font-weight:700; display:flex; flex-direction:column; gap:3px; color:var(--ink);}
  .binbtn small{font-weight:400; color:var(--ink-soft); font-size:0.74rem;}
  .binbtn.wet{border-color:var(--forest);}
  .binbtn.wet:hover{background:#EAF3EC;}
  .binbtn.dry{border-color:var(--signal-dark);}
  .binbtn.dry:hover{background:#FBF1DD;}
  .binbtn.hazard{border-color:var(--clay);}
  .binbtn.hazard:hover{background:#F8E9E5;}

  /* learn: quiz game */
  .quizopt{display:block; width:100%; text-align:left; padding:14px 16px; border:1.5px solid var(--line); border-radius:var(--radius); background:var(--white); font-weight:600; cursor:pointer; margin-bottom:10px; color:var(--ink);}
  .quizopt:hover{border-color:var(--forest);}

  /* watch & earn */
  .vidgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px; margin-top:10px;}
  .vidcard{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .vidframe-wrap{position:relative; width:100%; padding-bottom:56.25%; background:#0E1512;}
  .vidframe-inner{position:absolute; inset:0; width:100%; height:100%;}
  .vidframe-inner iframe{position:absolute; inset:0; width:100% !important; height:100% !important; border:0;}
  .vidbody{padding:16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .vidtitle{font-weight:700; font-size:1rem; color:var(--forest-dark);}
  .vidsource{font-size:0.78rem; color:var(--moss); font-weight:600;}
  .vidblurb{font-size:0.86rem; color:var(--ink-soft); flex:1; margin:0;}

  /* live activity feed */
  .livefeed{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    margin:28px 0 4px; overflow:hidden;
  }
  .livefeed-label{
    display:flex; align-items:center; gap:7px; padding:11px 16px 0;
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--moss);
  }
  .livefeed-label .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--clay); flex:none;
    box-shadow:0 0 0 3px rgba(196,87,59,0.18); animation:pulseDot 1.7s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .donorticker{overflow:hidden; position:relative;}
  .donorticker::before, .donorticker::after{content:''; position:absolute; top:0; bottom:0; width:36px; z-index:2; pointer-events:none;}
  .donorticker::before{left:0; background:linear-gradient(90deg, var(--panel), transparent);}
  .donorticker::after{right:0; background:linear-gradient(270deg, var(--panel), transparent);}
  .donorticker-track{display:inline-flex; white-space:nowrap; padding:9px 0 12px; animation:tickerScroll 30s linear infinite;}
  .donorticker-track:hover{animation-play-state:paused;}
  .donor-item{display:inline-flex; align-items:center; color:var(--ink-soft); font-size:0.84rem; font-weight:600; padding:0 22px; border-right:1px solid var(--line); white-space:nowrap;}
  .donor-item strong{color:var(--ink);}
  @keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* leaderboard */
  .lbcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}
  .lbcard-head{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .lbcard-head h3{font-size:1.15rem; margin:0;}
  .lbgrid{display:grid; grid-template-columns:1fr; gap:24px; margin-top:6px;}
  @media (min-width:820px){ .lbgrid{grid-template-columns:1fr 1fr;} }
  .lbtable{width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .lbtable th{background:var(--panel); color:var(--forest-dark); text-align:left; padding:10px 12px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; border-bottom:2px solid var(--forest);}
  .lbtable td{padding:10px 12px; border-top:1px solid var(--line); font-size:0.9rem;}
  .lbtable tr.me{background:#FBF1DD;}
  .lbrank{font-family:'Barlow Condensed'; font-weight:900; color:var(--moss); font-size:1.15rem;}
  .lbname{font-weight:700;}
  .lbcredits{font-weight:700; color:var(--forest-dark); text-align:right;}

  /* plantation events */
  .eventgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; margin-top:14px;}
  .eventcard{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:7px;}
  .eventcard .edate{color:var(--signal-dark); font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.3px;}
  .eventcard .etitle{font-family:'Barlow Condensed'; font-weight:900; font-size:1.32rem; color:var(--forest-dark);}
  .eventcard .eloc{color:var(--ink-soft); font-size:0.86rem;}
  .eventcard .edesc{font-size:0.88rem; color:var(--ink-soft); flex:1; margin:0;}
  .eventcard .ereward{font-weight:700; color:var(--forest); font-size:0.85rem;}
  .eventcard .eattend{font-size:0.76rem; color:var(--moss); font-weight:600;}

  .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--radius);
    background:var(--white); color:var(--ink);
  }
  .field select:focus{border-color:var(--forest);}

  @media (min-width: 720px){
    .navpanel-inner{grid-template-columns:repeat(4, 1fr);}
  }

  /* ---- digital ID card ---- */
  .idcam{background:#0E1512; border-radius:var(--radius); overflow:hidden; position:relative; aspect-ratio:1/1; max-width:320px;}
  .idcam video, .idcam img{width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1);}
  .idcam .facering{position:absolute; inset:10%; border:2px dashed rgba(255,255,255,0.35); border-radius:50%; pointer-events:none;}

  .idcard-stage{display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start; margin-top:18px;}

  .idcard{
    width:340px; max-width:100%; border-radius:12px; overflow:hidden;
    background:var(--white); border:1px solid var(--line);
    box-shadow:0 10px 26px rgba(22,63,42,0.22);
    position:relative; font-family:'Work Sans', sans-serif;
  }
  .idcard-head{
    background:linear-gradient(120deg, var(--forest) 0%, var(--forest-dark) 100%);
    color:var(--white); padding:14px 16px 12px; position:relative; overflow:hidden;
  }
  .idcard-head::after{
    content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px;
    background:rgba(232,162,39,0.18); border-radius:50%;
  }
  .idcard-brand{display:flex; align-items:center; gap:8px; position:relative; z-index:1;}
  .idcard-brand .mark{width:10px;height:10px; background:var(--signal); display:inline-block; transform:rotate(45deg);}
  .idcard-brand .name{font-family:'Barlow Condensed', sans-serif; font-weight:900; font-size:20px; letter-spacing:0.4px; color:var(--white);}
  .idcard-brand .tag{margin-left:auto; text-align:right; font-size:0.62rem; font-weight:700; letter-spacing:0.6px; color:var(--signal); text-transform:uppercase;}
  .idcard-brand .tag small{display:block; font-weight:600; color:rgba(255,255,255,0.75); letter-spacing:0.3px;}
  .idcard-strip{height:5px; background:linear-gradient(90deg, var(--signal), var(--forest) 35%, var(--white) 35%, var(--white) 65%, var(--clay) 65%);}
  .idcard-body{display:flex; gap:14px; padding:16px; background:var(--panel);}
  .idcard-photo{
    width:88px; height:104px; border-radius:6px; overflow:hidden; flex:none;
    border:2px solid var(--white); box-shadow:0 2px 6px rgba(0,0,0,0.18); background:#dcd8cb;
  }
  .idcard-photo img{width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}
  .idcard-fields{flex:1; min-width:0;}
  .idcard-fields .idname{font-family:'Barlow Condensed', sans-serif; font-weight:900; font-size:1.25rem; color:var(--forest-dark); line-height:1.05; word-break:break-word;}
  .idcard-fields .idrow{margin-top:7px; font-size:0.76rem;}
  .idcard-fields .idrow .idlab{color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; font-size:0.66rem; font-weight:700;}
  .idcard-fields .idrow .idval{font-weight:600; color:var(--ink); font-size:0.88rem;}
  .idcard-foot{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 16px; background:var(--forest-dark); color:rgba(255,255,255,0.85); font-size:0.66rem;
  }
  .idcard-foot .leaf{color:var(--signal); font-weight:700; display:flex; align-items:center; gap:5px; text-transform:uppercase; letter-spacing:0.4px;}
  .idcard-foot .idno{font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.6px;}
  .idcard-watermark{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; overflow:hidden; z-index:0;
  }
  .idcard-watermark span{
    font-family:'Barlow Condensed', sans-serif; font-weight:900; font-size:2.6rem; color:rgba(31,90,60,0.05);
    white-space:nowrap; transform:rotate(-18deg);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="logo" id="logoBtn" aria-label="CleanCred home"><span class="mark"></span>CleanCred</button>
      <button class="navtoggle" id="navToggle" aria-expanded="false">
        <span id="navToggleLabel">Menu</span>
      </button>
    </div>
  </header>
  <nav class="navpanel" id="navPanel">
    <div class="navpanel-inner" id="navPanelInner"></div>
  </nav>
  <main>
    <div class="wrap" id="content"></div>
  </main>
  <footer class="site">

function haversineMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------------- mobile-safe camera + location helpers ----------------
   Mobile browsers (iOS Safari, Android Chrome/WebView) are much stricter than
   desktop about camera/location: both APIs are only exposed on secure origins
   (https, or localhost), navigator.mediaDevices can be entirely undefined on
   an insecure origin instead of throwing a clear error, GPS fixes indoors can
   time out under enableHighAccuracy, and <video> elements need an explicit
   play() call after srcObject is set or the preview can stay blank on iOS. */
function pickRecorderMimeType(){
  // iOS/iPadOS Safari has never supported video/webm for MediaRecorder — it
  // only records mp4. Checking webm first and giving up on failure (as the
  // original code did) silently produced a recorder with no mimeType hint,
  // which happened to still work in some Safari versions but not others.
  // Explicitly trying the mp4 variants Safari does support first avoids
  // relying on that undefined behavior.
  const candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  if(window.MediaRecorder && MediaRecorder.isTypeSupported){
    for(const type of candidates){
      if(MediaRecorder.isTypeSupported(type)) return type;
    }
  }
  return ''; // let the browser pick its own default
}
function isSecureContextForMedia(){
  // window.isSecureContext is the accurate, spec-defined check (true for
  // https: and http://localhost, false for plain http:// on a LAN/IP address
  // — which is the single most common reason "it works on my laptop but not
  // my phone" happens, since phones are almost always hitting the site over
  // a non-localhost address).
  return typeof window.isSecureContext === 'boolean' ? window.isSecureContext : location.protocol === 'https:';
}
function mediaUnavailableReason(){
  if(!isSecureContextForMedia()){
    return "Camera and location only work over a secure (https://) connection. This page is loaded over an insecure connection, which mobile browsers block automatically.";
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return "This browser doesn't expose camera access here. Try the latest Chrome or Safari, and make sure the page isn't opened inside an app's built-in browser/webview with camera access disabled.";
  }
  return null;
}
async function getCameraStreamSafe(facingMode){
  const blockedReason = mediaUnavailableReason();
  if(blockedReason) throw new Error(blockedReason);
  // Use {ideal:...} rather than a bare string: some mobile browsers treat a
  // bare facingMode string as a hard (exact) requirement and throw
  // OverconstrainedError on devices that don't expose an exact match, even
  // though a close-enough camera exists.
  const attempts = [
    { video:{ facingMode:{ ideal: facingMode } }, audio:false },
    { video:true, audio:false } // last-resort fallback: any camera at all
  ];
  let lastErr;
  for(const constraints of attempts){
    try{
      return await navigator.mediaDevices.getUserMedia(constraints);
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}
function attachStreamToVideo(videoEl, stream){
  if(!videoEl) return;
  videoEl.srcObject = stream;

  // always honored reliably — explicitly calling play() (and swallowing the
  // benign AbortError some browsers throw if playback was already starting)
  // makes the live preview show up consistently.
  const p = videoEl.play();

}
function locationUnavailableReason(){
  if(!navigator.geolocation) return "Your browser doesn't support location services, so we can't verify a spot here.";

  return null;
}
// err.name is the standard DOMException name getUserMedia rejects with.
// err.message on its own is often blank or a low-level string like
// "Permission denied" that doesn't tell a mobile user what to actually do
// about it, so map the known names to concrete next steps instead.
function friendlyCameraError(err){
  const name = err && err.name;
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    return "Camera access was denied. On iPhone: Settings > Safari (or your browser app) > Camera, and allow it for this site. On Android: tap the lock icon in the address bar > Permissions > Camera > Allow. Then reload the page and try again.";
  }
  if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    return "No usable camera was found on this device.";
  }
  if(name === 'NotReadableError' || name === 'TrackStartError'){
    return "The camera is already in use by another app. Close any other app or tab using the camera and try again.";
  }
  if(name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError'){
    return "Couldn't get a compatible camera on this device. Try a different browser.";
  }
  if(name === 'SecurityError'){
    return "Camera access is blocked because this page isn't loaded over a secure https:// connection.";
  }
  return (err && err.message) || "Camera access failed for an unknown reason.";
}
// Surfaces the exact reason camera/location won't work *before* the person
// taps anything — on mobile the most common failure (insecure origin, e.g.
// testing over http://192.168.x.x instead of https://) otherwise gives no
// visible sign anything is wrong until they've already tried and failed.
function mediaEnvWarningBanner(){
  const reason = mediaUnavailableReason() || locationUnavailableReason();
  if(!reason) return '';
  return `<div class="banner warn" style="margin-bottom:14px;"><strong>Heads up:</strong> ${esc(reason)}</div>`;
}
function friendlyGeoError(err){
  // err.code: 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE, 3 = TIMEOUT
  if(err.code === 1) return "Location access was denied. Enable location for this site in your phone's browser settings, then try again.";
  if(err.code === 3) return "Getting your exact location timed out — this is common indoors on mobile. Step outside or near a window and try again.";
  return err.message || "Location is temporarily unavailable.";
}
/* Tries a high-accuracy GPS fix first (best for confirming you're standing at

   which uses network/Wi-Fi based positioning and succeeds far more often on
   mobile indoors. onStatus(text) is called with progress messages. */
function getPositionSafe(onSuccess, onError, onStatus){
  const reason = locationUnavailableReason();
  if(reason){ onError({code:0, message:reason}); return; }
  if(onStatus) onStatus('Getting your location…');
  navigator.geolocation.getCurrentPosition(
    onSuccess,
    err=>{
      if(err.code === 3){
        if(onStatus) onStatus('Still looking for a signal — trying a faster, lower-accuracy fix…');
        navigator.geolocation.getCurrentPosition(onSuccess, err2=>onError(err2), {
          enableHighAccuracy:false, timeout:15000, maximumAge:60000
        });
      } else {
        onError(err);
      }
    },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );
}

/* ---- record logic ---- */
function bindRecord(){
  const p = currentProfile();
  if(!p) return;
  const btn = document.getElementById('checkLocBtn');
  if(btn) btn.addEventListener('click', checkLocation);
  renderCamArea();
}
function checkLocation(){
  const banner = document.getElementById('locBanner');
  getPositionSafe(pos=>{
    const {latitude, longitude} = pos.coords;
    let best=null, bestDist=Infinity;
    state.spots.approved.forEach(s=>{
      const d = haversineMeters(latitude, longitude, s.lat, s.lng);
      if(d < bestDist){ bestDist=d; best=s; }
    });
    if(best && bestDist <= best.radius){
      state.record.verifiedSpot = {...best, dist:bestDist};
      banner.innerHTML = bannerVerified(state.record.verifiedSpot);
      document.getElementById('checkLocBtn').textContent = 'Re-check location';
      document.getElementById('checkLocBtn').classList.remove('signal');
      document.getElementById('checkLocBtn').classList.add('secondary');
      renderCamArea();
    } else {
      state.record.verifiedSpot = null;
      const nearestTxt = best ? ` The nearest one, ${esc(best.name)}, is ${Math.round(bestDist)} m away.` : '';
      banner.innerHTML = `<div class="banner err"><strong>No verified spot here.</strong>${nearestTxt} Head to a listed spot, or add this location on the "Request a spot" page.</div>`;
      renderCamArea();
    }
  }, err=>{
    banner.innerHTML = `<div class="banner err">We couldn't get your location (${esc(friendlyGeoError(err))}).</div>`;
  }, statusText=>{
    banner.innerHTML = `<div class="banner warn">${esc(statusText)}</div>`;
  });
}

function renderCamArea(){
  const area = document.getElementById('camArea');
  if(!area) return;
  const r = state.record;
  if(!r.verifiedSpot){
    area.innerHTML = `<p class="hint">Camera unlocks once your location is verified above.</p>`;
    return;
  }
  if(r.blobUrl){
    area.innerHTML = `
      <div class="camwrap"><video src="${r.blobUrl}" controls playsinline></video></div>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn signal" id="submitDropBtn">Submit for credits</button>
        <button class="btn secondary" id="retakeBtn">Retake</button>
      </div>
    `;
    document.getElementById('submitDropBtn').addEventListener('click', submitDrop);
    document.getElementById('retakeBtn').addEventListener('click', ()=>{ r.blobUrl=null; renderCamArea(); });
    return;
  }
  if(!r.stream){
    area.innerHTML = `<button class="btn signal" id="openCamBtn">Turn on camera</button><p class="hint" style="margin-top:8px;">We'll ask your browser for camera permission. There is no file picker anywhere in this flow, by design.</p>`;
    document.getElementById('openCamBtn').addEventListener('click', openCamera);
    return;
  }
  area.innerHTML = `
    <div class="camwrap">
      <video id="liveVideo" autoplay muted playsinline></video>
      ${r.recording ? `<div class="recdot"><span class="dot"></span>REC</div>` : ''}
    </div>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
      ${r.recording
        ? `<button class="btn clay" id="stopRecBtn">Stop recording</button>`
        : `<button class="btn signal" id="startRecBtn">Start recording</button>`}
      <button class="btn secondary" id="closeCamBtn">Turn off camera</button>
    </div>
    <p class="hint" style="margin-top:8px;">Recording stops automatically after 8 seconds.</p>
  `;
  const v = document.getElementById('liveVideo');
  attachStreamToVideo(v, r.stream);
  if(r.recording){
    document.getElementById('stopRecBtn').addEventListener('click', stopRecording);
  }else{
    document.getElementById('startRecBtn').addEventListener('click', startRecording);
  }
  document.getElementById('closeCamBtn').addEventListener('click', ()=>{ stopCamera(); renderCamArea(); });
}

async function openCamera(){
  const area = document.getElementById('camArea');
  try{
    const stream = await getCameraStreamSafe('environment');
    state.record.stream = stream;
    renderCamArea();
  }catch(e){
    area.innerHTML = `<div class="banner err">${esc(friendlyCameraError(e))}</div>
    <button class="btn secondary" id="retryCamBtn" style="margin-top:10px;">Try again</button>`;
    document.getElementById('retryCamBtn').addEventListener('click', openCamera);
  }
}
function startRecording(){
  const r = state.record;
  if(!r.stream) return;
  r.chunks = [];
  const mime = pickRecorderMimeType();
  try{
    r.recorder = mime ? new MediaRecorder(r.stream, {mimeType:mime}) : new MediaRecorder(r.stream);
  }catch(e){
    r.recorder = new MediaRecorder(r.stream);
  }
  r.recorder.ondataavailable = ev=>{ if(ev.data && ev.data.size>0) r.chunks.push(ev.data); };
  r.recorder.onstop = ()=>{
    const blob = new Blob(r.chunks, {type: r.recorder.mimeType || 'video/webm'});
    r.blobUrl = URL.createObjectURL(blob);
    r.recording = false;
    stopCamera(true);
    renderCamArea();
  };
  r.recorder.start();
  r.recording = true;
  renderCamArea();
  r._autoStop = setTimeout(()=>{ if(r.recording) stopRecording(); }, 8000);
}
function stopRecording(){
  const r = state.record;
  if(r._autoStop) clearTimeout(r._autoStop);
  if(r.recorder && r.recorder.state !== 'inactive') r.recorder.stop();
}
function stopCamera(keepBlob){
  const r = state.record;
  if(r.stream){
    r.stream.getTracks().forEach(t=>t.stop());
  }
  r.stream = null;
  r.recorder = null;
  r.recording = false;
  if(!keepBlob){ /* keep blobUrl if we just finished recording */ }
}
async function submitDrop(){
  const p = currentProfile();
  if(!p) return;
  const earned = 8 + Math.floor(Math.random()*8); // 8-15 credits
  p.credits += earned;
  p.history.unshift({ type:'earn', desc:`Verified drop at ${state.record.verifiedSpot.name}`, amount:earned, date:new Date().toISOString() });
  await persistProfiles();
  state.record.blobUrl = null;
  state.record.verifiedSpot = null;
  const area = document.getElementById('camArea');
  area.innerHTML = `<div class="banner ok"><strong>+${earned} credits added.</strong> Nice work — check your account for the updated balance.</div>
    <button class="btn signal" data-go="account" style="margin-top:10px;">View my account</button>`;
  area.querySelector('[data-go]').addEventListener('click', ()=> setView('account'));
  document.getElementById('locBanner').innerHTML='';
  document.getElementById('checkLocBtn').textContent = 'Check my location';
  document.getElementById('checkLocBtn').classList.add('signal');
  document.getElementById('checkLocBtn').classList.remove('secondary');
}

/* ---- Sort It Right ---- */
function startSortGame(){
  const pool = SORT_ITEMS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  state.sortGame = { queue: pool.slice(0,10), index:0, score:0, correct:0, finished:false, lastResult:null };
  state.activeGame = 'sort';
  render();
}
function renderSortGame(){
  const g = state.sortGame;
  if(!g) return '';
  if(g.finished){

  }
  const item = g.queue[g.index];
  const fb = g.lastResult ? `<div class="banner ${g.lastResult.correct?'ok':'err'}" style="max-width:340px;">${g.lastResult.correct ? 'Correct!' : `Not quite — ${esc(g.lastResult.item.name)} is ${BIN_META[g.lastResult.correctBin].label.toLowerCase()}.`}</div>` : '';
  return `
  <div class="eyebrow">Sort It Right — item ${g.index+1} of ${g.queue.length}</div>
  <h1 style="font-size:1.9rem;">Where does this go?</h1>
  <p class="hint">2 credits per correct sort · ${g.score} earned so far</p>
  ${fb}
  <div class="itemcard">

    <div class="nm">${esc(item.name)}</div>
  </div>

    <button class="binbtn dry" data-bin="dry">Dry<small>Recyclable</small></button>
    <button class="binbtn hazard" data-bin="hazard">Hazardous<small>Special handling</small></button>
  </div>
  `;
}
async function answerSort(binId){
  const g = state.sortGame;
  if(!g || g.finished) return;
  const item = g.queue[g.index];
  const correct = item.bin === binId;
  if(correct){ g.score += 2; g.correct++; }
  g.lastResult = { correct, correctBin:item.bin, item };
  g.index++;
  if(g.index >= g.queue.length){
    g.finished = true;
    await awardGameCredits(`Sort It Right — ${g.correct}/${g.queue.length} correct`, g.score);
  }
  render();
}

    if(!document.getElementById('yt-iframe-api')){

function genIdNumber(username){
  let h = 0;
  const str = String(username||'member');
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  const digits = String(h % 1000000).padStart(6,'0');
  return 'CC-IN-' + digits;
}

    const stream = await getCameraStreamSafe('user');
    state.idcardCapture.stream = stream;
    renderIdCamArea();
  }catch(e){
    area.innerHTML = `<div class="banner err">${esc(friendlyCameraError(e))}</div>
    <button class="btn secondary" id="idRetryCamBtn" style="margin-top:10px;">Try again</button>`;
    document.getElementById('idRetryCamBtn').addEventListener('click', openIdCardCamera);
  }
}
function captureIdPhoto(){
  const v = document.getElementById('idLiveVideo');
  if(!v || !v.videoWidth) return;
  const size = Math.min(v.videoWidth, v.videoHeight);
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  const sx = (v.videoWidth - size)/2, sy = (v.videoHeight - size)/2;
  ctx.drawImage(v, sx, sy, size, size, 0, 0, 320, 320);
  state.idcardCapture.photoData = canvas.toDataURL('image/jpeg', 0.9);
  stopIdCardCamera();
  renderIdCamArea();
}
function stopIdCardCamera(){
  const c = state.idcardCapture;
  if(c.stream){ c.stream.getTracks().forEach(t=>t.stop()); }
  c.stream = null;
}
async function saveIdCard(){
  const p = currentProfile();
  if(!p) return;
  const msg = document.getElementById('idCardMsg');
  const name = document.getElementById('idNameInput').value.trim();
  const dob = document.getElementById('idDobInput').value;
  const stateVal = document.getElementById('idStateInput').value;
  const photo = state.idcardCapture.photoData || (p.idCard && p.idCard.photo);
  if(!name || !dob || !stateVal || !photo){
    msg.innerHTML = `<div class="banner err" style="margin-top:12px;">Name, date of birth, state and a captured front-camera photo are all required.</div>`;
    return;
  }
  p.idCard = {
    name, dob, state: stateVal, photo,
    idNo: (p.idCard && p.idCard.idNo) || genIdNumber(state.currentUser),
    issuedISO: new Date().toISOString()
  };
  await persistProfiles();
  state.idcardCapture.editing = false;
  state.idcardCapture.photoData = null;
  render();
}

/* ================= REQUEST SPOT ================= */
function viewRequestSpot(){
  return `
  <section class="section wrap narrow" style="padding:0;">
    <div class="eyebrow">Request a spot</div>
    <h1 style="font-size:2.2rem;">Add a dumping point</h1>
    <p class="lede" style="margin-top:10px;">Know a bin or dumpster that should count for credit? Stand at it, capture your live location, and submit it. New spots become checkable right away so you can verify from there next time.</p>

    <div class="card" style="margin-top:20px;">
      <div class="field">
        <label for="spotName">Spot name</label>
        <input id="spotName" placeholder="e.g. Balmatta bus stand bin">
      </div>
      <div class="field">
        <label for="spotNote">Notes (optional)</label>
        <textarea id="spotNote" rows="3" placeholder="Anything that helps others find it"></textarea>
      </div>
      <div id="spotCoordsMsg" class="hint" style="margin-bottom:12px;">Location not captured yet.</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn secondary" id="captureLocBtn">Use my current location</button>
        <button class="btn signal" id="submitSpotBtn" disabled>Submit spot</button>
      </div>
      <div id="spotMsg"></div>
    </div>
  </section>

  <section class="section">
    <h3 style="font-size:1.3rem; margin-bottom:10px;">Recently added spots</h3>
    <div class="spotlist">
      ${state.spots.approved.slice().reverse().slice(0,8).map(s=>`
        <div class="spotitem"><span>${esc(s.name)}</span><span class="dist">${s.source==='seed' ? 'seed data' : 'community-added'}</span></div>
      `).join('')}
    </div>
  </section>
  `;
}
function bindRequestSpot(){
  let captured = null;
  const coordsMsg = document.getElementById('spotCoordsMsg');
  const submitBtn = document.getElementById('submitSpotBtn');
  document.getElementById('captureLocBtn').addEventListener('click', ()=>{
    getPositionSafe(pos=>{
      captured = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      coordsMsg.textContent = `Captured: ${captured.lat.toFixed(5)}, ${captured.lng.toFixed(5)}`;
      submitBtn.disabled = false;
    }, err=>{
      coordsMsg.textContent = `Couldn't get location (${friendlyGeoError(err)}).`;
    }, statusText=>{
      coordsMsg.textContent = statusText;
    });
  });
  submitBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('spotName').value.trim();
    const msg = document.getElementById('spotMsg');
    if(!name){ msg.innerHTML = `<div class="banner err" style="margin-top:12px;">Give the spot a name.</div>`; return; }
    if(!captured){ msg.innerHTML = `<div class="banner err" style="margin-top:12px;">Capture your location first.</div>`; return; }
    const spot = {
      id: 's' + Date.now(),
      name,
      lat: captured.lat, lng: captured.lng,
      radius: 120,
      source: 'community',
      submittedBy: state.currentUser || 'anonymous'
    };
    state.spots.approved.push(spot);
    await saveData('spots-db', true, state.spots);
    msg.innerHTML = `<div class="banner ok" style="margin-top:12px;"><strong>Spot added.</strong> It's live — you can check in from here on the Record page.</div>`;
    submitBtn.disabled = true;
    document.getElementById('spotName').value='';
    document.getElementById('spotNote').value='';
  });
}

/* ================= BUSINESSES ================= */
function viewBusinesses(){
  const p = currentProfile();
  return `
  <section class="section">
    <div class="eyebrow">Redeem credits</div>
    <h1 style="font-size:2.2rem;">Spend where it counts</h1>
    <p class="lede" style="margin-top:10px; max-width:600px;">These local businesses partner with CleanCred to turn your credits into real coupons.</p>
    ${p ? `<div class="banner ok" style="max-width:400px;">You have <strong>${p.credits} credits</strong> to spend.</div>` : `<div class="banner warn" style="max-width:420px;">Log in on the "My account" page to redeem credits.</div>`}
    <div class="bizgrid">
      ${state.businesses.map(b=>`
        <div class="bizcard">
          <div class="emoji">${b.emoji}</div>
          <div class="name">${esc(b.name)}</div>
          <div class="cat">${esc(b.cat)}</div>
          <div class="offer">${esc(b.offer)}</div>
          <div class="cost">${b.cost} credits</div>
          <button class="btn ${p && p.credits>=b.cost ? 'signal' : 'secondary'}" data-redeem="${b.id}" ${!p || p.credits<b.cost ? 'disabled' : ''}>Redeem</button>
        </div>
      `).join('')}
    </div>
    <div id="redeemMsg" style="margin-top:16px;"></div>
  </section>
  `;
}
function bindBusinesses(){
  document.querySelectorAll('[data-redeem]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const p = currentProfile();
      const biz = state.businesses.find(b=>b.id===btn.dataset.redeem);
      if(!p || !biz || p.credits < biz.cost) return;
      p.credits -= biz.cost;
      const code = 'CC-' + Math.random().toString(36).slice(2,8).toUpperCase();
      p.history.unshift({ type:'redeem', desc:`Redeemed at ${biz.name} (code ${code})`, amount:biz.cost, date:new Date().toISOString() });
      await persistProfiles();
      document.getElementById('redeemMsg').innerHTML = `<div class="banner ok">Redeemed! Your coupon code for <strong>${esc(biz.name)}</strong> is <strong>${code}</strong>. Show this at checkout.</div>`;
      render();
    });
  });
}

function viewPartner(){
  return `
  <section class="section wrap narrow" style="padding:0;">
    <div class="eyebrow">For businesses</div>
    <h1 style="font-size:2.2rem;">Partner with CleanCred</h1>
    <p class="lede" style="margin-top:10px;">Offer a coupon or discount that CleanCred members can redeem with their credits, and get in front of people who are actively keeping your area clean.</p>

      <div class="field"><label for="pContact">Contact email</label><input id="pContact" type="email" placeholder="owner@business.com"></div>
      <div class="field"><label for="pCat">Category</label><input id="pCat" placeholder="e.g. Food & drink, retail, services"></div>
      <div class="field"><label for="pMsg">What offer would you like to give?</label><textarea id="pMsg" rows="3" placeholder="e.g. 10% off, free item with purchase"></textarea></div>

  </section>
  `;
}
function bindPartner(){
  document.getElementById('partnerSubmitBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('pName').value.trim();
    const contact = document.getElementById('pContact').value.trim();
    const cat = document.getElementById('pCat').value.trim();
    const msgText = document.getElementById('pMsg').value.trim();

    if(!name || !contact){
      out.innerHTML = `<div class="banner err" style="margin-top:12px;">Business name and contact email are required.</div>`;

    }
    state.partnerApps.push({ name, contact, cat, msgText, date:new Date().toISOString() });

}

/* ================= DONATE ================= */
function viewDonate(){
  return `
  <section class="section wrap narrow" style="padding:0;">
    <div class="eyebrow">Support us</div>
    <h1 style="font-size:2.2rem;">Help keep CleanCred running</h1>
    <p class="lede" style="margin-top:10px;">CleanCred is upkept as a public-good project — hosting, verification checks and partner outreach all cost something. Donations go straight to keeping the site free for everyone throwing trash the right way.</p>
    <div class="card" style="margin-top:20px;">
      <div class="field"><label>Amount (₹)</label>
        <div class="amtgrid">
          <button class="amtbtn" data-amt="50">₹50</button>
          <button class="amtbtn" data-amt="150">₹150</button>
          <button class="amtbtn" data-amt="500">₹500</button>
          <button class="amtbtn" data-amt="custom">Other</button>
        </div>
        <input id="customAmt" type="number" min="1" placeholder="Enter amount" style="display:none;">
      </div>
      <div class="field"><label for="dName">Name (optional)</label><input id="dName" placeholder="Anonymous"></div>
      <div class="field"><label for="dMsg">Message (optional)</label><textarea id="dMsg" rows="2" placeholder="A note to the team"></textarea></div>
      <button class="btn signal block" id="donateBtn">Donate</button>
      <p class="hint" style="margin-top:10px;">This preview doesn't connect to a real payment processor — your donation is recorded here to show how the flow would work.</p>
      <div id="donateMsg"></div>
    </div>
  </section>
  <section class="section">
    <h3 style="font-size:1.2rem;">Recent supporters</h3>
    ${state.donations.length===0 ? `<p class="hint">No donations yet — be the first.</p>` : `
    <div class="histlist">
      ${state.donations.slice().reverse().slice(0,10).map(d=>`
        <div class="histrow"><div>${esc(d.name||'Anonymous')}${d.msg? ' — '+esc(d.msg):''}<div class="when">${fmtDate(d.date)}</div></div><div class="amt plus">₹${d.amount}</div></div>
      `).join('')}
    </div>`}
  </section>
  `;
}
function bindDonate(){
  let chosen = null;
  document.querySelectorAll('.amtbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.amtbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      const custom = document.getElementById('customAmt');
      if(b.dataset.amt === 'custom'){
        custom.style.display='block'; custom.focus(); chosen = null;
      }else{
        custom.style.display='none';
        chosen = parseInt(b.dataset.amt, 10);
      }
    });
  });
  document.getElementById('donateBtn').addEventListener('click', async ()=>{
    const custom = document.getElementById('customAmt');
    let amount = chosen;
    if(custom.style.display==='block'){ amount = parseInt(custom.value,10); }
    const out = document.getElementById('donateMsg');
    if(!amount || amount<=0){
      out.innerHTML = `<div class="banner err" style="margin-top:12px;">Choose or enter an amount.</div>`;
      return;
    }
    const name = document.getElementById('dName').value.trim();
    const msgText = document.getElementById('dMsg').value.trim();
    state.donations.push({ name, msg: msgText, amount, date:new Date().toISOString() });
    await saveData('donations-log', true, state.donations);
    out.innerHTML = `<div class="banner ok" style="margin-top:12px;">Thank you${name?', '+esc(name):''} — your ₹${amount} donation was recorded.</div>`;
    render();
  });
}

init();
</script>
